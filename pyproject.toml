[build-system]
requires = ["uv_build==0.12.3"]
build-backend = "uv_build"

[project]
name = "scrapy-extension"
version = "0.1.0"
description = "Distributed crawling for Scrapy with ten pluggable queue, deduplication, and storage backends."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "azwpayne", email = "paynewu0719@gmail.com" }]
requires-python = ">=3.10"
keywords = [
    "scrapy",
    "crawler",
    "distributed",
    "redis",
    "mongodb",
    "kafka",
    "rabbitmq",
    "elasticsearch",
    "rocketmq",
    "pulsar",
    "sqs",
    "memcached",
    "dynamodb",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Scrapy",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    # Scrapy's TLS identity chain reaches pyasn1 through service-identity.
    # 0.6.4 fixes CVE-2026-59884/59885/59886 decoder DoS flaws.
    "pyasn1>=0.6.4,<0.7",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.15.0,<3",
    "scrapy>=2.17.0,<3",
    "typing-extensions>=4.16.0,<5",
]

[project.urls]
Homepage = "https://github.com/azwpayne/scrapy-extension"
Repository = "https://github.com/azwpayne/scrapy-extension"
Issues = "https://github.com/azwpayne/scrapy-extension/issues"
Changelog = "https://github.com/azwpayne/scrapy-extension/blob/main/.github/CHANGELOG.md"

[project.optional-dependencies]
# NOTE: Backends use PEP 562 lazy imports — deps are loaded on demand.
redis = ["redis>=8.1.0,<9"]
mongodb = ["pymongo>=4.8.0,<5"]
kafka = ["kafka-python-ng>=2.2.2,<3"]
rabbitmq = ["pika>=1.4.4,<2"]
elasticsearch = ["elasticsearch>=9.4.1,<10"]
rocketmq = ["rocketmq-python-client>=5.1.1,<6"]
pulsar = ["pulsar-client>=3.13.0,<4"]
# Experimental — supply-chain caveat: pymemcache is unmaintained (last release
# 2022-10-17, ~1300+ days stale). The `memcached` extra is storage-only (KV+TTL).
# See .github/STABILITY.md "Memcached" row for status; tracked as U20.
memcached = ["pymemcache>=4.0,<5"]
sqs = ["boto3>=1.43.68,<2"]
dynamodb = ["boto3>=1.43.68,<2"]
all = [
    "redis>=8.1.0,<9",
    "pymongo>=4.8.0,<5",
    "kafka-python-ng>=2.2.2,<3",
    "pika>=1.4.4,<2",
    "elasticsearch>=9.4.1,<10",
    "rocketmq-python-client>=5.1.1,<6",
    "pulsar-client>=3.13.0,<4",
    "pymemcache>=4.0,<5",
    "boto3>=1.43.68,<2",
]

[dependency-groups]
dev = [
    "packaging>=26.0,<27",
    "poethepoet",
    "ruff",
]
test = [
    "packaging>=26.0,<27",
    "pytest",
    # Referenced by the root collection gate and warning policy, so the test
    # group must be independently runnable from an extracted sdist.
    "pytest-benchmark>=5.2.3",
    "pytest-xdist[psutil]",
    "pytest-randomly",
    "pytest-timeout",
    "pytest-mock",
    "pytest-cov",
    "coverage[toml]",
    "pytest-sugar",
    "pytest-instafail",
    "pytest-socket",
    "mypy",
    "bandit[toml]",
    "hypothesis>=6.165.2,<7",
    # Backend deps — tests import backend modules directly, which triggers
    # the module-level lazy-import guard. All backends must be installable
    # for the test suite to collect.
    "redis>=8.1.0,<9",
    "pymongo>=4.8.0,<5",
    "kafka-python-ng>=2.2.2,<3",
    "pika>=1.4.4,<2",
    "elasticsearch>=9.4.1,<10",
    # apache rocketmq-python-client is pure-Python (gRPC + protobuf, no native
    # lib) — installable in the test env without the librocketmq pain that
    # blocked the old ctypes client. Required so the lazy-import guard in
    # backends/rocketmq.py lets module collection succeed.
    "rocketmq-python-client>=5.1.1,<6",
    "pulsar-client>=3.13.0,<4",
    "pymemcache>=4.0,<5",
    "boto3>=1.43.68,<2",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.uv.build-backend]
source-include = [
    ".github/audit-fixtures/**",
    ".github/audit-waivers.toml",
    ".github/CHANGELOG.md",
    ".github/CONTRIBUTING.md",
    ".github/SECURITY.md",
    ".github/STABILITY.md",
    ".github/workflows/**",
    "conftest.py",
    "docs/**",
    "examples/**",
    "tests/**",
    "tools/**",
    "uv.lock",
]
source-exclude = [
    # uv-build's explicit source includes are broader than .gitignore. Keep
    # workstation state, local databases, and internal scratch plans out of a
    # release even when a maintainer builds from a dirty checkout.
    "**/.omc/**",
    "**/.env*",
    "**/.secrets/**",
    "**/credentials/**",
    "**/secrets/**",
    "**/*.pem",
    "**/*.key",
    "**/*.crt",
    "**/*.cer",
    "**/*.p12",
    "**/*.pfx",
    "**/*.jks",
    "**/*.keystore",
    # Coverage, test, type-checker, and tool caches/reports.
    "**/.coverage",
    "**/.coverage.*",
    "**/.benchmarks/**",
    # Keep this project-rooted: isolated uv_build extracts the sdist below its
    # own ~/.cache path, so **/.cache/** would exclude the wheel payload itself.
    "./.cache/**",
    "**/.hypothesis/**",
    "**/.mypy_cache/**",
    "**/.pytest_cache/**",
    "**/.ruff_cache/**",
    "**/__pycache__/**",
    "**/coverage.json",
    "**/coverage.xml",
    "**/htmlcov/**",
    "**/reports/**",
    # Local runtime state and generated packaging canaries.
    "**/*.db",
    "**/*.db-*",
    "**/*.log",
    "**/*.sqlite",
    "**/*.sqlite-*",
    "**/*.sqlite3",
    "**/*.sqlite3-*",
    "**/local-settings.*",
    "**/local_settings.py",
    "**/generated-canary*/**",
    "**/.packaging-canary*/**",
    "**/.DS_Store",
    # Historical working notes and archived audits are useful in Git but are
    # not user-facing package documentation.
    "docs/archive/**",
    "docs/audits/**",
    "docs/insight/**",
    "docs/superpowers/**",
]

[tool.poe]
executor.type = "uv"
tasks.full = ["check"]
tasks.check = ["format-check", "lint-check", "type-check", "security-check"]
tasks.test = [
    "test-py310",
    "test-py311",
    "test-py312",
    "test-py313",
    "test-py314",
    "test-py314t"
]

# Verification tasks never edit the worktree. Use the explicit *-fix tasks to
# apply mechanical changes locally.
tasks.format-check = "ruff format --check src tests conftest.py"
tasks.format-fix = "ruff format src tests conftest.py"
tasks.lint-check = "ruff check"
tasks.lint-fix = "ruff check --fix --unsafe-fixes"
tasks.type-check = "mypy --strict src"
tasks.security-check = "bandit -r src -c pyproject.toml"

# Keep the existing entry points, but make them safe read-only aliases.
tasks.format = ["format-check"]
tasks.lint = ["lint-check"]

tasks.test-py310 = { shell = "uv run --python 3.10 --group test pytest" }
tasks.test-py311 = { shell = "uv run --python 3.11 --group test pytest" }
tasks.test-py312 = { shell = "uv run --python 3.12 --group test pytest" }
tasks.test-py313 = { shell = "uv run --python 3.13 --group test pytest" }
tasks.test-py314 = { shell = "uv run --python 3.14 --group test pytest" }
# Free-threaded build. NOTE: lxml (pulled transitively by scrapy via parsel)
# re-enables the GIL on import, so this verifies 3.14t interpreter-compat —
# NOT GIL-free concurrency. True free-threading can't be exercised while
# scrapy depends on lxml (R81).
tasks.test-py314t = { shell = "uv run --python 3.14t --group test pytest" }

tasks.clean = { shell = """
	rm -rf .pytest_cache htmlcov .coverage coverage.xml .ruff_cache .benchmarks reports
	find . -type d -name __pycache__ -exec rm -rf {} +
	find . -type f -name "*.pyc" -delete
""" }

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
exclude = ["examples"]

[tool.ruff.lint]
select = [
    "B",
    "F",
    "I",
    "RUF",
    "UP",
]
ignore = [
    "B009",
    "B904",
    "RUF043",
    "RUF059",
    "RUF100",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "F811",
    "F841",
    "RUF012",
]

[tool.pytest.ini_options]
minversion = "8.0"
python_files = ["test_*.py", "*_test.py", "testing.py"]
python_classes = ["Test*", "*Test"]
python_functions = ["test_*", "it_*", "its_*", "check_*"]
pythonpath = ["src", "."]
testpaths = ["tests", "src"]
addopts = [
    "-v",
    "--tb=short",
    "--disable-socket",
]
strict_markers = true
timeout = 60
timeout_method = "thread"
filterwarnings = [
    "error::UserWarning", # 将警告视为错误
    # Remote plaintext compatibility warnings are exercised explicitly in
    # test_remote_plaintext_transition.py. Suppress duplicate expected warnings
    # from unrelated backend fixtures so new warning classes remain visible.
    "ignore:Remote unauthenticated plaintext .* connections are deprecated:FutureWarning:scrapy_extension\\.settings\\._transport_security",
    # itemadapter 0.13.1 imports pydantic.v1 only to recognise legacy item
    # models. Pydantic emits this warning on 3.14 even when the application
    # exclusively uses Pydantic v2. Keep the exemption exact by message and
    # stacklevel-reported importer module; every other UserWarning stays fatal.
    "ignore:Core Pydantic V1 functionality isn't compatible with Python 3\\.14 or greater\\.:UserWarning:itemadapter\\._imports",
    # xdist disables benchmarks during pytest_configure; keep that one expected
    # plugin warning from becoming an INTERNALERROR. This must follow the broad
    # UserWarning rule because the last matching filter takes precedence.
    "ignore:Benchmarks are automatically disabled because xdist plugin is active:pytest_benchmark.logger.PytestBenchmarkWarning",
    "ignore::DeprecationWarning:pkg_resources.*",
]
markers = [
    # `unit` and `e2e` are descriptive labels on selected contracts, not
    # complete tiers. CI selects the complete broker tier by integration mark
    # and treats everything else as the socket-blocked default suite.
    "unit: descriptive label on selected isolated tests; not a complete tier",
    "integration: complete live-broker tier under tests/integration",
    "e2e: descriptive label on selected end-to-end contracts; not a complete tier",
    "benchmark: opt-in pytest-benchmark measurements",
    "reference_model: local model checks with no production backend evidence",
]
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/conftest.py",
    "*/migrations/*",
    "*/venv/*",
]
branch = true
parallel = true
concurrency = ["thread", "multiprocessing"]

[tool.coverage.report]
precision = 2
# CI reads coverage.json and independently gates statement and branch rates;
# coverage.py's combined percentage would hide which contract regressed.
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "reports/coverage"
title = "Coverage Report"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # 跳过assert检查（pytest使用大量assert）

[tool.mypy]
# U8 — mypy --strict clean (py.typed public promise).
# Strict mode is on; per-module overrides below relax only the genuinely
# untyped third-party surfaces (redis-py's Sentinel/ClusterNode factories,
# the kafka-python / pika / pymemcache clients which ship no inline stubs).
strict = true
warn_unused_configs = true
warn_redundant_casts = true
follow_imports = "normal"
ignore_missing_imports = true
show_error_codes = true
pretty = true

# Third-party libs that ship no py.typed marker / no inline annotations.
# Calls into these would otherwise force `# type: ignore` sprinkles across
# every backend; the override keeps the call-sites strict-clean while we
# still type everything we own. Stubs-only — does NOT weaken first-party code.
[[tool.mypy.overrides]]
module = [
  "redis",
  "redis.*",
  "kafka.*",
  "pika.*",
  "pymemcache.*",
  "rocketmq.*",
  "pulsar.*",
]
disallow_untyped_calls = false

[tool.pytest-watcher]
now = true
patterns = ["*.py", "*.toml"]
ignore_patterns = ["*.pyc", "__pycache__/*", "reports/*"]
