name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  # Fast unit job — runs on every push to main and every pull request. No external services required.
  # Integration tests (tests/integration/, marker `integration`) are
  # deselected here; they need live backends and are run in the parallel
  # integration-tests job below.
  unit-tests:
    runs-on: ubuntu-latest
    # Bound each matrix lane so a stalled dependency or test cannot consume
    # GitHub Actions' multi-hour default timeout.  The normal suite completes
    # in minutes; 30 minutes leaves headroom for a cold runner.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv==0.11.29
      - name: Sync dependencies (test group)
        run: uv sync --python ${{ matrix.python-version }} --locked --group test
      - name: Verify project Python ${{ matrix.python-version }}
        run: >-
          uv run --no-sync python -c
          "import sys; expected = tuple(map(int, '${{ matrix.python-version }}'.split('.')));
          assert sys.version_info[:2] == expected, (sys.version, expected)"
      - name: Repository hygiene contracts
        if: matrix.python-version == '3.10'
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files -ci --exclude-standard)"
          uv run --no-sync pytest tests/test_repository_hygiene.py -q
      - name: Ruff
        run: uv run --no-sync ruff check
      - name: Ruff format
        if: matrix.python-version == '3.10'
        run: uv run --no-sync ruff format --check src tests conftest.py
      - name: Mypy (strict)
        if: matrix.python-version == '3.10'
        run: uv run --no-sync mypy --strict src
      - name: Bandit
        if: matrix.python-version == '3.10'
        run: uv run --no-sync bandit -r src -c pyproject.toml
      - name: Dependency vulnerability audit
        if: matrix.python-version == '3.10'
        shell: bash
        # The checker binds the one waiver to its package, lock range, owner,
        # evidence fixture, and expiry before exposing its advisory ID. The
        # audit still fails for every other present or future advisory.
        run: |
          set -euo pipefail
          waiver_id=$(uv run --no-sync python tools/check_audit_waiver.py)
          uv audit --locked --ignore "$waiver_id"
      - name: Discover and import examples without starting a crawl
        if: matrix.python-version == '3.10'
        shell: bash
        run: |
          set -euo pipefail
          spiders=$(cd examples && uv run --no-sync scrapy list)
          diff -u \
            <(printf '%s\n' quotes quotes_connection_manager quotes_crawl \
              quotes_elasticsearch quotes_kafka quotes_mongodb quotes_multi_mode \
              quotes_programmatic quotes_rabbitmq quotes_redis) \
            <(printf '%s\n' "$spiders")
          uv run --no-sync python - <<'PY'
          import importlib
          import pkgutil
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("examples").resolve()))
          import examples

          modules = sorted(
              module.name
              for module in pkgutil.walk_packages(
                  examples.__path__, examples.__name__ + "."
              )
          )
          assert modules
          for module in modules:
              importlib.import_module(module)
          print(f"imported {len(modules)} example modules without broker I/O")
          PY
      - name: Pytest xdist/benchmark compatibility canary
        if: matrix.python-version == '3.10'
        run: >-
          uv run --no-sync pytest -n 2 --benchmark-disable
          --randomly-seed=1125147632
          tests/test_memory_filter.py::TestMemoryMembershipFilter::test_add_new_returns_true -q
      - name: Benchmark smoke (five measurements)
        if: matrix.python-version == '3.10'
        shell: bash
        run: |
          uv run --no-sync pytest \
            tests/test_bench_push_pop.py::test_push_single \
            tests/test_bench_push_pop.py::test_pop_single \
            tests/test_bench_push_pop.py::test_push_batch_of_10_latency \
            tests/test_bench_serialization.py::test_request_to_dict \
            tests/test_bench_serialization.py::test_serialize_deserialize_roundtrip \
            --benchmark-only --benchmark-warmup=off \
            --benchmark-json=benchmark-smoke.json -q
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          benchmarks = json.loads(
              Path("benchmark-smoke.json").read_text(encoding="utf-8")
          )["benchmarks"]
          assert len(benchmarks) == 5, (
              f"expected 5 benchmark results, got {len(benchmarks)}"
          )
          assert all(result["stats"]["rounds"] > 0 for result in benchmarks)
          PY
      - name: Build package artifacts from a clean tracked archive twice
        if: matrix.python-version == '3.10'
        shell: bash
        run: |
          set -euo pipefail
          build_root=$(mktemp -d)
          git archive --format=tar HEAD | tar -xf - -C "$build_root"
          for pass in 1 2; do
            out="$GITHUB_WORKSPACE/.artifact-build-$pass"
            (
              cd "$build_root"
              uv build --clear --python ${{ matrix.python-version }} --out-dir "$out"
            )
            (cd "$out" && sha256sum * | sort -k2) > ".artifact-hashes-$pass"
          done
          diff -u .artifact-hashes-1 .artifact-hashes-2
          mkdir dist
          cp .artifact-build-1/* dist/
          cat .artifact-hashes-1
      - name: Verify wheel and source artifact manifests
        if: matrix.python-version == '3.10'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          forbidden='(^|/)(\.coverage($|\.)|\.benchmarks/|\.cache/|\.env[^/]*|\.hypothesis/|\.mypy_cache/|\.packaging-canary|\.pytest_cache/|\.ruff_cache/|\.secrets/|__pycache__/|credentials/|generated-canary|htmlcov/|reports/|secrets/)|\.(db|log|sqlite|sqlite3)(-|$)|\.(pem|key|crt|cer|p12|pfx|jks|keystore)$|(^|/)local[_-]settings\.|(^|/)docs/(archive|audits|insight|superpowers)/'
          for artifact in "${wheels[0]}" "${sdists[0]}"; do
            if [[ "$artifact" == *.whl ]]; then
              contents=$(unzip -Z1 "$artifact")
            else
              contents=$(tar -tzf "$artifact")
            fi
            if grep -Ei --quiet "$forbidden" <<<"$contents"; then
              printf 'Forbidden file in %s:\n' "$artifact" >&2
              grep -Ei "$forbidden" <<<"$contents" >&2
              exit 1
            fi
          done
          sdist_contents=$(tar -tzf "${sdists[0]}" | sed 's|^[^/]*/||')
          for required in \
            conftest.py \
            uv.lock \
            .github/audit-waivers.toml \
            .github/audit-fixtures/PYSEC-2017-83.json \
            .github/workflows/ci.yml \
            .github/workflows/codeql.yml \
            examples/README.md \
            examples/scrapy.cfg \
            tests/test_packaging_contract.py \
            tools/check_audit_waiver.py; do
            grep -Fqx "$required" <<<"$sdist_contents"
          done
          wheel_contents=$(unzip -Z1 "${wheels[0]}")
          grep -Fqx 'scrapy_extension/py.typed' <<<"$wheel_contents"
          grep -Eq '^scrapy_extension-[^/]+\.dist-info/METADATA$' <<<"$wheel_contents"
          grep -Eq '^scrapy_extension-[^/]+\.dist-info/licenses/LICENSE$' <<<"$wheel_contents"
          if grep -Eq '(^|/)(tests|examples|docs|conftest\.py|uv\.lock)(/|$)' <<<"$wheel_contents"; then
            echo "Wheel contains source-only test or documentation files" >&2
            exit 1
          fi
      - name: Test the extracted sdist in its own locked environment
        if: matrix.python-version == '3.10'
        shell: bash
        run: |
          set -euo pipefail
          extract_root=$(mktemp -d)
          tar -xzf dist/*.tar.gz -C "$extract_root"
          source_root=$(find "$extract_root" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$source_root"
          uv sync --project "$source_root" --python ${{ matrix.python-version }} \
            --locked --no-default-groups --group test
          (
            cd "$source_root"
            uv run --no-sync pytest \
              tests/test_packaging_contract.py tests/test_collection_gates.py -q
          )
      - name: Smoke-test package artifacts
        if: matrix.python-version == '3.10'
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          for artifact in "${wheels[0]}" "${sdists[0]}"; do
            venv=".venv-package-smoke-$(basename "$artifact" | tr -cd '[:alnum:]')"
            uv venv --python ${{ matrix.python-version }} "$venv"
            uv pip install --python "$venv/bin/python" "$artifact"
            "$venv/bin/python" -I -c "import pathlib, scrapy_extension; from importlib.metadata import version; assert str(pathlib.Path(scrapy_extension.__file__).resolve()).startswith(str(pathlib.Path('$venv').resolve())); assert version('scrapy-extension')"
            all_venv=".venv-package-smoke-all-$(basename "$artifact" | tr -cd '[:alnum:]')"
            uv venv --python ${{ matrix.python-version }} "$all_venv"
            uv pip install --python "$all_venv/bin/python" "${artifact}[all]"
            "$all_venv/bin/python" -I - <<'PY'
          import pathlib
          import os
          import sys
          from importlib.metadata import version

          import boto3
          import elasticsearch
          import kafka
          import pika
          import pulsar
          import pymemcache
          import pymongo
          import redis

          _expanduser = os.path.expanduser
          _rocketmq_home = pathlib.Path(sys.prefix) / "rocketmq-import-home"

          def _isolated_expanduser(path: str) -> str:
              if path == "~":
                  return str(_rocketmq_home)
              if path.startswith("~/"):
                  return str(_rocketmq_home / path[2:])
              return _expanduser(path)

          os.path.expanduser = _isolated_expanduser
          try:
              import rocketmq
          finally:
              os.path.expanduser = _expanduser

          import scrapy_extension

          optional_exports = (
              "DynamoDBBackend",
              "DynamoDBMode",
              "DynamoDBSettings",
              "ElasticSearchBackend",
              "ElasticSearchMode",
              "ElasticSearchSettings",
              "KafkaBackend",
              "KafkaMode",
              "KafkaSettings",
              "MemcachedBackend",
              "MemcachedMode",
              "MemcachedSettings",
              "MongoDBBackend",
              "MongoDBMode",
              "MongoDBSettings",
              "PulsarBackend",
              "PulsarMode",
              "PulsarSettings",
              "RabbitMQBackend",
              "RabbitMQMode",
              "RabbitMQSettings",
              "RedisBackend",
              "RedisMode",
              "RedisSettings",
              "RocketMQBackend",
              "RocketMQMode",
              "RocketMQSettings",
              "SqsBackend",
              "SqsMode",
              "SqsSettings",
          )
          venv_root = pathlib.Path(sys.prefix).resolve()
          assert str(pathlib.Path(scrapy_extension.__file__).resolve()).startswith(
              str(venv_root)
          )
          assert version("scrapy-extension")
          assert all(getattr(scrapy_extension, name) for name in optional_exports)
          PY
          done
      - name: Reactor lifecycle heartbeat regression
        if: matrix.python-version == '3.10'
        run: uv run --no-sync pytest tests/test_reactor_lifecycle.py -q --disable-socket
      - name: Unit tests with statement and branch coverage (integration deselected)
        if: matrix.python-version == '3.10'
        env:
          SCRAPY_TEST_FAIL_ON_UNEXPECTED_SKIP: "1"
        shell: bash
        run: |
          # Keep the coverage order fixed: the suite intentionally exercises
          # process-global lifecycle state, and a random order can change which
          # defensive branch is reached even when every test passes.
          uv run --no-sync pytest -m "not integration" --tb=short -q \
            --randomly-seed=1125147632 \
            --cov=scrapy_extension --cov-report=term-missing \
            --cov-report=json:coverage.json
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          totals = json.loads(Path("coverage.json").read_text(encoding="utf-8"))["totals"]
          statement_rate = 100 * totals["covered_lines"] / totals["num_statements"]
          branch_rate = 100 * totals["covered_branches"] / totals["num_branches"]
          statement_floor = 95.0
          branch_floor = 91.0
          print(f"statement coverage: {statement_rate:.2f}% (floor {statement_floor:.2f}%)")
          print(f"branch coverage: {branch_rate:.2f}% (floor {branch_floor:.2f}%)")
          assert statement_rate >= statement_floor, "statement coverage floor failed"
          assert branch_rate >= branch_floor, "branch coverage floor failed"
          PY
      - name: Unit tests (integration deselected)
        if: matrix.python-version != '3.10'
        env:
          SCRAPY_TEST_FAIL_ON_UNEXPECTED_SKIP: "1"
        run: >-
          uv run --no-sync pytest -m "not integration" --tb=short -q
          --randomly-seed=1125147632

  # Integration job — runs tests under tests/integration/ against
  # containerized backends. Runs in parallel with unit-tests so it never
  # blocks the fast unit lane.
  #
  # Service healthchecks: redis/mongodb/elasticsearch/rabbitmq and LocalStack
  # expose real health endpoints. Kafka and Memcached are probed from the
  # runner below. Pulsar runs in standalone mode via `docker run` because it needs
  # the `bin/pulsar standalone` command, which GitHub Actions' services block
  # cannot express.
  #
  # RocketMQ runs via docker-compose (tests/integration/docker-compose.yml),
  # not the services block, because its broker needs --enable-proxy + a
  # mounted rmq-proxy.json (enableAutoTopicCreation) + broker.conf, and the
  # apache 5.x client speaks gRPC to the proxy (8081). The pure-Python client
  # (rocketmq-python-client 5.1.1) needs no native lib, so the suite runs on
  # the stock GitHub runner. See #44.
  integration-tests:
    runs-on: ubuntu-latest
    # Bound the whole job, including GitHub's service-image initialization. A
    # hung broker-client op (no per-op timeout) used to bleed to Actions'
    # 360-min default; 30 min leaves cold image pulls enough headroom while
    # retaining a hard cap for the live suite's per-test timeout below.
    timeout-minutes: 30
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      elasticsearch:
        # Match the elasticsearch-py client major (9.x, bumped in 4a686f8).
        # client 9 sends `Accept: ...compatible-with=9`, which ES server 8.x
        # rejects with HTTP 400 ("Accept version must be either version 8 or
        # 7, but found 9"), so every request — including ping() — failed and
        # the integration suite couldn't connect. Validated locally: all ES
        # integration tests pass against this 9.4.1 image.
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.1
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmqctl status"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      kafka:
        image: bitnamilegacy/kafka:4.0.0-debian-12-r10
        env:
          KAFKA_CFG_NODE_ID: "1"
          KAFKA_CFG_PROCESS_ROLES: controller,broker
          KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        ports:
          - 9092:9092
      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211
      localstack:
        image: localstack/localstack:4.11.1
        env:
          SERVICES: sqs,dynamodb
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/init/ready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.29
      - name: Sync dependencies (test group + all backend extras)
        run: uv sync --python 3.12 --locked --group test --all-extras
      - name: Verify project Python 3.12
        run: >-
          uv run --no-sync python -c
          "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
      - name: Wait for Kafka and Memcached ports
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/9092) >/dev/null 2>&1 && \
              (echo > /dev/tcp/127.0.0.1/11211) >/dev/null 2>&1; then
              echo "Kafka and Memcached are accepting connections"
              exit 0
            fi
            echo "Kafka or Memcached not ready ($i/30)"; sleep 5
          done
          echo "Kafka or Memcached did not become ready in time" >&2
          exit 1
      - name: Bring up Pulsar standalone broker
        # The Pulsar service requires `bin/pulsar standalone`; Docker Compose
        # is unnecessary for this single container, while the Actions services
        # block cannot supply its command.
        run: |
          docker run --detach --rm --name scrapy-ext-pulsar \
            --env PULSAR_MEM="-Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m" \
            --publish 6650:6650 --publish 8080:8080 \
            apachepulsar/pulsar:4.1.2 \
            bin/pulsar standalone
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/admin/v2/brokers/health >/dev/null; then
              echo "Pulsar broker is ready"
              exit 0
            fi
            echo "pulsar not ready ($i/30)"; sleep 5
          done
          docker logs scrapy-ext-pulsar
          echo "Pulsar did not become ready in time" >&2
          exit 1
      - name: Bring up RocketMQ (namesrv + broker with --enable-proxy)
        # The broker needs --enable-proxy (gRPC on 8081) + a mounted
        # rmq-proxy.json (enableAutoTopicCreation) + broker.conf, which the
        # GitHub Actions `services` block can't express cleanly. docker-compose
        # reuses the validated fixture (same networking the _ensure_topic
        # helper's defaults assume: rocketmq-namesrv / scrapy-ext-rocketmq-broker).
        run: |
          docker compose -f tests/integration/docker-compose.yml up -d --wait rocketmq-namesrv rocketmq-broker
          # Extra warmup: the proxy port opens before topic-service is fully
          # registered. Poll a route fetch via the python client.
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/8081) >/dev/null 2>&1; then
              echo "RocketMQ gRPC proxy accepting connections on 8081"
              exit 0
            fi
            echo "rocketmq-proxy not ready ($i/30)"; sleep 5
          done
          echo "RocketMQ proxy did not become ready in time" >&2
          exit 1
      - name: Run integration tests
        env:
          # Global opt-in gate (root conftest.py): without SCRAPY_TEST_INTEGRATION=1,
          # every integration test SKIPS via the conftest-level guard and this job
          # validates nothing (false green — the per-backend URLs alone are not
          # enough; this flag is what actually enables the suite). Verified:
          # Unset means the entire live-service suite skips (a false green).
          SCRAPY_TEST_INTEGRATION: "1"
          SCRAPY_TEST_FAIL_ON_UNEXPECTED_SKIP: "1"
          SCRAPY_TEST_REDIS_URL: redis://localhost:6379/0
          SCRAPY_TEST_MONGODB_URI: mongodb://localhost:27017
          SCRAPY_TEST_ES_HOSTS: http://localhost:9200
          SCRAPY_TEST_ES_OUTCOME_SAFETY: "1"
          SCRAPY_TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          SCRAPY_TEST_KAFKA_BOOTSTRAP: localhost:9092
          SCRAPY_TEST_PULSAR_URL: pulsar://localhost:6650
          # The service publishes IPv4; avoid IPv6-first localhost resolution.
          SCRAPY_TEST_MEMCACHED_HOST: 127.0.0.1
          # LocalStack emulates both AWS services. These are intentionally
          # non-secret test credentials; no cloud account is contacted.
          SCRAPY_TEST_SQS_ENDPOINT: http://localhost:4566
          SCRAPY_TEST_DYNAMODB_ENDPOINT: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          # gRPC PROXY endpoint (host:8081), NOT the NameServer. The broker
          # runs with --enable-proxy via the compose step above.
          SCRAPY_TEST_ROCKETMQ_NAMESRV: localhost:8081
        # Global addopts (pyproject.toml) set --disable-socket. That blocks the
        # broker connections this job needs — redis/mongo/es/rabbitmq error fast
        # (SocketBlockedError), but RocketMQ's apache gRPC client retries the
        # blocked connection with no cap and HANGS (the original 6h-bleed root
        # cause). --allow-hosts opens localhost, where every CI broker lives, so
        # the suite can reach them while external sockets stay blocked.
        run: >
          uv run --no-sync pytest tests/integration
          -m integration --tb=short -v --timeout=120
          --allow-hosts=localhost,127.0.0.1,::1
  # Dependency security scan job — runs on every push and pull request.
  # Uses pinned tooling to avoid flaky network requirements in ordinary unit checks.
  # Runs in parallel with unit-tests so it never blocks the fast unit lane.
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip the security scan on pull requests from forks to avoid
    # supply-chain confusion; the unit-tests job still validates deps.
    if: github.event_name != 'pull_request' or github.event.pull_request.head.repo.owner.login == github.repository_owner
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv and pinned audit tooling
        run: python -m pip install uv==0.11.29
      - name: Sync locked audit environment
        run: uv sync --locked --no-default-groups --group dev
      - name: Lock dependency graph and run audit
        run: |
          set -euo pipefail
          # A checked-in lock is part of the release contract: --check verifies
          # it matches pyproject.toml, while --locked refuses to resolve drift.
          uv lock --check
          waiver_id=$(uv run --no-sync python tools/check_audit_waiver.py)
          # The waiver checker binds the one approved PYSEC-2017-83
          # (GHSA-h7wm-ph43-c39p) exception to its package, range, owner,
          # fixture, and expiry. Every other advisory remains fatal.
          uv audit --locked --ignore "$waiver_id"
      - name: Publish audit report
        if: always()
        run: |
          set -euo pipefail
          # Output the audit summary for artifact retention
          uv audit --locked > audit-report.txt 2>&1 || true
